<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La Nuestra TT — Tournament Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-logo">🏓</span>
      <div>
      <div class="brand-name">La Nuestra TT</div>
      <div class="brand-sub">Table Tennis Fixture Manager</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btnReset" class="btn ghost danger" title="Clear everything and start over">↺ Reset All</button>
    </div>
  </div>
</header>

<nav class="stepper" id="stepper" aria-label="Tournament stages"></nav>

<main id="app"></main>

<footer class="foot">Group stage: best-of-3 sets · 11 points &nbsp;|&nbsp; Semis &amp; Final: best-of-5 sets</footer>

<!-- Score entry / result modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
